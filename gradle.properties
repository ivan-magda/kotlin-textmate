# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX libraries
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enable Gradle build cache
org.gradle.caching=true

# Use the configuration cache for subsequent builds.
org.gradle.configuration-cache=true

# Enable parallel execution
org.gradle.parallel=true

# Non-transitive R class for faster builds
android.nonTransitiveRClass=true

# Maven publishing — shared coordinates and POM metadata.
# Set artifact IDs, names, and descriptions in the mavenPublishing block for each module.
# The publishing plugin reads common values from this file.
GROUP=io.github.ivan-magda
VERSION_NAME=0.3.0-SNAPSHOT

POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/ivan-magda/kotlin-textmate

POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/ivan-magda/kotlin-textmate
POM_SCM_CONNECTION=scm:git:git://github.com/ivan-magda/kotlin-textmate.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/ivan-magda/kotlin-textmate.git

POM_DEVELOPER_ID=ivan-magda
POM_DEVELOPER_NAME=Ivan Magda
POM_DEVELOPER_EMAIL=ivan.magda@outlook.com
POM_DEVELOPER_URL=https://github.com/ivan-magda
