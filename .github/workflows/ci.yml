name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run core tests
        run: ./gradlew :core:test

      - name: Check build plugins
        run: ./gradlew -p build-logic check

      - name: Assemble Android modules
        run: ./gradlew :compose-ui:assembleDebug :sample-app:assembleDebug

      - name: Assemble minified release (R8 regression guard)
        run: ./gradlew :sample-app:assembleRelease

      - name: Lint Android modules
        run: ./gradlew lint lintRelease

      - name: Check public ABI
        run: ./gradlew apiCheck

      - name: Compile benchmarks
        run: ./gradlew :benchmark:compileKotlin

      - name: Check publication artifacts
        run: |
          ./gradlew :core:publishToMavenLocal :compose-ui:publishToMavenLocal \
            -PVERSION_NAME=0.0.0-ci-SNAPSHOT \
            -Dmaven.repo.local="$RUNNER_TEMP/maven-local" \
            --no-build-cache --no-configuration-cache

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: core/build/reports/tests/
          retention-days: 7
